[workspace]
resolver = "2"
members = ["psiv-data", "psiv-core", "psiv-runtime", "psiv-godot"]
# psiv-godot joins when the presentation slice starts (editor: ~/.local/bin/cairn-godot-4.7.1).

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
