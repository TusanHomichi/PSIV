# Native ROM-free checks. Checkout paths exercise spaces, parentheses and Unicode.
# The release workflow owns the headless exported-game smoke on each OS.
name: platforms
on:
  pull_request:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "oracle/build_core.sh"
      - ".gitattributes"
      - "psiv_tools/**"
      - "tests/test_pack_swap.py"
      - "tests/test_text_files.py"
      - ".github/workflows/platforms.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - "oracle/build_core.sh"
      - ".gitattributes"
      - "psiv_tools/**"
      - "tests/test_pack_swap.py"
      - "tests/test_text_files.py"
      - ".github/workflows/platforms.yml"
defaults:
  run:
    shell: bash
    working-directory: "PSIV (portabilité)"
permissions:
  contents: read
jobs:
  pack-builder:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "PSIV (portabilité)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pack builder portability tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests.test_pack_swap tests.test_text_files
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "PSIV (portabilité)"
      - name: Fetch the pinned Nuked OPN2 C source
        run: ./oracle/build_core.sh --sources
      - name: ROM-free Rust tests (MSVC / Apple clang included)
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
