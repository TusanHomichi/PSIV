# The gate is the flake: CI runs `nix flake check`, through burrow's shared
# workflow, on a hosted runner (a public repo's PRs never reach the machine).
# It covers the part of the gate that needs no ROM or other local input
# (docs/DEVELOPMENT.md#gate-and-coverage). The shared workflow is pinned to a
# commit (burrow main, 2026-10-26), and Renovate keeps the pin current.
name: flake
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@8121c5e4947ad8b7f0b41a9653388be02b6b4fbd # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
