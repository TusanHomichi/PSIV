# The gate is the flake: CI runs `nix flake check`, through burrow's shared
# workflow, on a hosted runner (a public repo's PRs never reach the machine).
# It covers the part of the gate that needs no ROM or other local input
# (docs/DEVELOPMENT.md#gate-and-coverage). The shared workflow is pinned to a
# commit (burrow main, 2026-10-26), and Renovate keeps the pin current.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@5fe4bb5868149b51bdb3cf2a555eb297ab41951a # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # Names this gate in what it attests, so a later push of the same tree
      # can be matched to it; only main's push asks remi's lookup
      # (Conary's docs/gate-reuse.md) and, on a hit, builds nothing.
      gate-reuse: true
      gate-reuse-lookup: https://remi.conary.io/conary/gate-reuse
