name: Bug or difference from the original
description: Something breaks, or PSIV does something the cartridge does not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Questions go to [Discussions](https://github.com/TusanHomichi/PSIV/discussions) instead.
        Check the [known differences](https://github.com/TusanHomichi/PSIV#known-differences) first.
        **Using an AI assistant?** Point it at [`docs/REPORTING.md`](https://github.com/TusanHomichi/PSIV/blob/main/docs/REPORTING.md) — it explains what logs/saves to gather and how to format the issue.
        Never attach the ROM, the data pack, or anything extracted from them.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the game this affects.
      options:
        - Setup / Launch
        - Field / Overworld
        - Battle
        - Cutscene / Dialogue
        - Camp / Shops / Saves
        - Audio
        - Platform / Controller / Display
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what PSIV did, and where in the game (location, party, story point, or battle enemies/abilities).
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original does
      description: What the cartridge does at the same point, if you know ("unsure" is fine).
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in your download's name (`PSIV-1.0.0-linux-x86_64.tar.gz` is 1.0.0), or the output of `git rev-parse --short HEAD` in a source checkout.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Steam Deck
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM check
      description: Does your ROM's SHA-256 match the one in the [player's guide](https://github.com/TusanHomichi/PSIV/blob/main/docs/PLAYING.md#the-rom)?
      placeholder: "yes"
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Save or steps to reproduce
      description: A PSIV save file reproduces most problems fastest ([where your saves live](https://github.com/TusanHomichi/PSIV/blob/main/docs/PLAYING.md#where-your-pack-and-saves-live)); attach it, or list the steps.
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (`logs/godot.log`)
      description: Paste any `ERROR:` / `WARNING:` lines or the last ~40 lines from `logs/godot.log` in your user data folder (redact personal usernames in paths).
      render: text
