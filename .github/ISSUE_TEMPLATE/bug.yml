name: Bug or difference from the original
description: Something breaks, or PSIV does something the cartridge does not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Questions go to [Discussions](https://github.com/TusanHomichi/PSIV/discussions) instead.
        Check the [known differences](https://github.com/TusanHomichi/PSIV#known-differences) first.
        Never attach the ROM, the data pack or anything extracted from them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what PSIV did, and where in the game.
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original does
      description: What the cartridge does at the same point, if you know.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in your download's name (`PSIV-1.0.0-linux-x86_64.tar.gz` is 1.0.0), or the output of `git rev-parse --short HEAD` in a source checkout.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Steam Deck
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM check
      description: Does your ROM's SHA-256 match the one in the [player's guide](https://github.com/TusanHomichi/PSIV/blob/main/docs/PLAYING.md#the-rom)?
      placeholder: "yes"
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Save or steps to reproduce
      description: A PSIV save file reproduces most problems fastest ([where your saves live](https://github.com/TusanHomichi/PSIV/blob/main/docs/PLAYING.md#where-your-pack-and-saves-live)); attach it, or list the steps.
